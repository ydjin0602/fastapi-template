[project]
name = "fastapi-template"
version = "0.4.0"
description = "Шаблонный проект для разработки веб приложений на fastapi."
requires-python = "==3.14.8"
maintainers = [{ name = "Evgeniy Mishchenko", email = "akk-06@mail.ru" }]
dependencies = [
    "asyncpg==0.32.0",
    "fastapi[all]==0.162.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
    "orjson==3.13.0",
    "loguru==0.7.3",
    "pydantic-settings==2.16.2",
    "starlette-exporter==0.24.0",
    "dishka==1.10.1",
    # FIXME: Если сервису не нужны Redis / Kafka — удали зависимости ниже
    #  вместе с провайдерами в app/api/di и секциями в app/config.py
    "redis==8.1.0",
    "faststream[confluent]==0.7.8",
    "dishka-faststream==0.7.0",
    "greenlet==3.5.6",
]

[dependency-groups]
dev = [
    "testcontainers==4.15.0",
    "asgi-lifespan==2.1.0",
    "pytest==9.2.0",
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-alembic==0.13.2",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "schemathesis==4.33.1",
    "psycopg[binary]==3.3.8",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = 3.14


[tool.pytest.ini_options]
asyncio_mode = "auto"
# Единый event loop на сессию — иначе asyncpg-коннекты из session-фикстур
# падают с "attached to a different loop" в function-scoped тестах
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-v"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]
testpaths = [
    "tests",
]

[tool.ruff]
# https://beta.ruff.rs/docs/rules/
lint.select = [
    "E", # PyCodeStyle errors
    "W", # PyCodeStyle warnings
    "I", # isort
    "N", # pep8-naming
    "F", # Pyflakes
    "UP", # pyupgrade
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "B", # flake8-bugbear
    "ASYNC", # flake8-asynс
    "G", # flake8-logging-forma
    "DTZ", # flake8-datetimez раскоментить после рефакторинг
    "D", # - докстринги - самый душный линтер
    "RUF", # Ruff-specific rules
    "ANN201", # - neccecary type hints (undocument foo)
    "ANN202", # - neccecary type hints (private foo)
    "ANN204", # - neccecary type hints (special foo)
    "ANN205", # - neccecary type hints (class foo)
    "ANN206", # - neccecary type hints (static foo)
]
lint.ignore = [
    "D100",
    "D101",
    "D104",
    "D105",
    "D106", # D106 Missing docstring in public nested class
    "D202", # D202cNo blank lines allowed after function docstring
    "N805",
    "B008", # B008 Do not perform function call `Depends` in argument defaults
    "D107", # Missing docstring in `__init__`
    "RUF001", # String contains ambiguous
    "RUF002", # Docstring contains ambiguous
    "RUF003", # Comment contains ambiguous
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
]
lint.extend-select = [
    "B006", # mutable-argument-default
#    "COM812", # missing-trailing-comma
    "PIE794", # duplicate-class-field-definition
]

# Allow unused variables when underscore-prefixed.
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"


# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    ".venv",
    "env",
    "cli.example",
    "cli",
]

# Same as Black.
line-length = 88

# Assume Python 3.14.
target-version = "py314"

[tool.ruff.lint.isort]
force-wrap-aliases = true
force-single-line = true
combine-as-imports = false
lines-between-types = 1

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"

[tool.ruff.lint.per-file-ignores]
"migrations/*.py" = ["D", "E402", "E501", "ANN", "SIM103"]
"tests/*.py" = ["D", "DTZ", "E501", "ANN"]
"tests/conftest.py" = ["E402"]
"app/api/v1/controllers/*.py" = ["D103"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
